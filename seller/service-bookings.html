<!doctype html><html lang="en" data-theme="dark"><head><title>Service Bookings | DesiMall</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/panel.css"><link rel="stylesheet" href="../css/seller.css"><link rel="stylesheet" href="../css/seller-pro.css?v=0.35.0"><link rel="stylesheet" href="../css/seller-services.css?v=0.35.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="panel-shell"><aside class="panel-sidebar"></aside><main class="panel-main">
<section class="services-hero"><div><span class="eyebrow">SERVICE OPERATIONS</span><h1>Bookings</h1><p>Accept, assign, travel, start and complete service jobs from one place.</p></div><button class="btn btn-light" id="refreshBookings"><i class="fa-solid fa-rotate"></i> Refresh</button></section>
<section class="svc-kpis"><article class="svc-kpi"><div><small>Requested</small><strong id="bkRequested">0</strong></div><i class="fa-solid fa-clock"></i></article><article class="svc-kpi"><div><small>Accepted</small><strong id="bkAccepted">0</strong></div><i class="fa-solid fa-check"></i></article><article class="svc-kpi"><div><small>On Job</small><strong id="bkLive">0</strong></div><i class="fa-solid fa-person-walking"></i></article><article class="svc-kpi"><div><small>Completed</small><strong id="bkCompleted">0</strong></div><i class="fa-solid fa-circle-check"></i></article></section>
<section class="booking-board"><div class="booking-list"><div class="booking-list-head"><h2>Service Requests</h2><select id="bookingFilter"><option value="">All statuses</option><option value="requested">Requested</option><option value="accepted">Accepted</option><option value="provider_on_way">On the way</option><option value="arrived">Arrived</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="bookingList"></div></div><div class="booking-detail" id="bookingDetail"><div class="booking-empty"><div><i class="fa-solid fa-calendar-check" style="font-size:42px"></i><h2>Select a booking</h2><p>Booking details and next actions will appear here.</p></div></div></div></section>
</main></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/seller-pro.js?v=0.36.0"></script><script src="../js/seller-shell.js?v=0.36.0"></script><script src="../js/seller-service-bookings.js?v=0.35.0"></script></body></html>
