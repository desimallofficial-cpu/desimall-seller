<!doctype html><html lang="en" data-theme="dark"><head><title>Services & Pricing | DesiMall</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/panel.css"><link rel="stylesheet" href="../css/seller.css"><link rel="stylesheet" href="../css/seller-pro.css?v=0.35.0"><link rel="stylesheet" href="../css/seller-services.css?v=0.35.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="panel-shell"><aside class="panel-sidebar"></aside><main class="panel-main">
<section class="services-hero"><div><span class="eyebrow">SERVICES CATALOG</span><h1>Services & Pricing</h1><p>Create customer-bookable packages with transparent pricing, visit charge, duration and warranty.</p></div><button class="btn btn-primary" id="openPackage"><i class="fa-solid fa-plus"></i> Add Service</button></section>
<section class="svc-card"><div class="svc-toolbar"><div><h2 style="margin:0">Your Services</h2><p class="muted">Only active packages are public.</p></div><div class="tools"><input id="packageSearch" placeholder="Search service"><select id="packageVertical"><option value="">All Verticals</option></select></div></div><div id="packageList" class="svc-packages"></div></section>
</main></div>
<div class="svc-modal" id="packageModal"><div class="svc-modal-box"><div class="svc-modal-head"><h2 id="packageTitle">Add Service</h2><button id="closePackage"><i class="fa-solid fa-xmark"></i></button></div><form class="svc-form" id="packageForm"><input type="hidden" id="pkgId"><label><span>Service Vertical *</span><select id="pkgVertical" required></select></label><div class="svc-form-row"><label><span>Service / Package Name *</span><input id="pkgName" required placeholder="e.g. AC General Service"></label><label><span>Service Mode *</span><select id="pkgMode"><option value="home">At Customer Home</option><option value="shop">At My Shop</option><option value="online">Online / Remote</option></select></label></div><label><span>Description *</span><textarea id="pkgDesc" rows="3" required></textarea></label><div class="svc-form-row three"><label><span>Pricing Type</span><select id="pkgPricing"><option value="fixed">Fixed Price</option><option value="starting_from">Starting From</option><option value="hourly">Hourly</option><option value="inspection">Inspection / Quote</option></select></label><label><span>Base Price ₹</span><input id="pkgPrice" type="number" min="0" value="0"></label><label><span>Visit Charge ₹</span><input id="pkgVisit" type="number" min="0" value="0"></label></div><div class="svc-form-row three"><label><span>Duration (minutes)</span><input id="pkgDuration" type="number" min="15" value="60"></label><label><span>Warranty (days)</span><input id="pkgWarranty" type="number" min="0" value="0"></label><label><span>Image URL</span><input id="pkgImage" placeholder="Optional service image URL"></label></div><div class="svc-checks"><label><input id="pkgEmergency" type="checkbox"> Emergency eligible</label><label><input id="pkgMaterials" type="checkbox"> Materials included</label><label><input id="pkgActive" type="checkbox" checked> Active / Bookable</label></div><button class="btn btn-primary" id="savePackage" type="submit">Save Service</button></form></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/seller-pro.js?v=0.35.0"></script><script src="../js/seller-shell.js?v=0.35.0"></script><script src="../js/seller-service-catalog.js?v=0.35.0"></script></body></html>
